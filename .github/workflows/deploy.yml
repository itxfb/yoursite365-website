name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production --base-href /

      - name: Create CNAME
        run: echo "www.yoursite365.com" > ./dist/yoursite365-website/browser/CNAME

      - name: Static page per route
        working-directory: ./dist/yoursite365-website/browser
        run: |
          for r in $(sed -n "s/.*path: '\([a-z-]\+\)'.*/\1/p" "$GITHUB_WORKSPACE/src/app/app.routes.ts"); do cp index.html "$r.html"; done
          cp index.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/yoursite365-website/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
