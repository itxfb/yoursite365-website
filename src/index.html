<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>YourSite365 — Your Site. Connected.</title>
  <meta name="description" content="Connect workforce, site access, compliance, attendance and labour costs. YourSite365 launches 05 February 2027.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon-yellow.svg" id="favicon">
  <script>
    (() => {
      const icon = document.getElementById('favicon');
      const set = () => (icon.href = document.visibilityState === 'visible' && document.hasFocus() ? 'favicon.svg' : 'favicon-yellow.svg');
      ['visibilitychange', 'focus', 'blur'].forEach((e) => addEventListener(e, set));
      set();
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
